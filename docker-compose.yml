version: '3.8'

services:
  # Tier 2: FastAPI Inference Microservice
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: davidnet-api
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_UPLOAD_BYTES=52428800 # 50 MB
      - HF_TOKEN=${HF_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tier 1: Next.js Client Presentation UI
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: davidnet-ui
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:7860
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped
